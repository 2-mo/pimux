name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  terminal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install terminal dependencies
        run: sudo apt-get update && sudo apt-get install -y tmux ncurses-term
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Check shell entry points
        run: bash -n pimux setup-tmux.sh install.sh uninstall.sh manager.bash ui.bash gpu.bash proxy.bash shell.bash bashrc scripts/package.sh
      - name: Check isolated terminal behavior
        run: uv run python -m pytest -q tests/test_pimux.py
      - name: Build release archive
        run: bash scripts/package.sh
