name: Checks
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE']
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  terminal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install terminal dependencies
        run: sudo apt-get update && sudo apt-get install -y tmux ncurses-term iproute2
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Check shell entry points
        run: |
          for file in pimux setup-tmux.sh install.sh lib/*.bash lib/bashrc scripts/*.sh; do
            bash -n "$file"
          done
      - name: Check isolated terminal behavior
        run: uv run python -m pytest -q tests/test_pimux.py tests/test_gpu.py tests/test_views.py tests/test_environment.py
      - name: Build release archive
        run: bash scripts/package.sh
