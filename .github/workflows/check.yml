name: Checks
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE']
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  terminal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check terminal behavior in the shared environment
        run: bash scripts/check.sh tests/test_pimux.py tests/test_gpu.py tests/test_views.py tests/test_environment.py tests/test_macos.py tests/test_host_runtime.py tests/test_native_terminal.py -q
      - name: Build release archive
        run: bash scripts/package.sh
  macos-terminal:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.29'
      - name: Keep dependency cache outside isolated test homes
        run: echo "UV_CACHE_DIR=$RUNNER_TEMP/pimux-uv-cache" >> "$GITHUB_ENV"
      - name: Build pinned removable native Bash and tmux
        run: |
          python scripts/build-macos-runtime.py "$RUNNER_TEMP/pimux-native-runtime"
          echo "$RUNNER_TEMP/pimux-native-runtime/prefix/bin" >> "$GITHUB_PATH"
          echo "PIMUX_BASH=$RUNNER_TEMP/pimux-native-runtime/prefix/bin/bash" >> "$GITHUB_ENV"
      - name: Prepare locked test dependencies
        run: uv sync --locked
      - name: Check native terminal and installed lifecycle
        run: >-
          uv run --locked python -m pytest tests/test_macos.py tests/test_gpu.py
          tests/test_views.py tests/test_environment.py tests/test_host_runtime.py
          tests/test_pimux.py tests/test_native_terminal.py -q
