name: Checks
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE']
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  terminal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check terminal behavior in the shared environment
        run: bash scripts/check.sh tests/test_pimux.py tests/test_tmux_passthrough.py tests/test_gpu.py tests/test_views.py tests/test_environment.py tests/test_installer.py -q
      - name: Build release archive
        run: bash scripts/package.sh
