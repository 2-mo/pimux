[project]
name = "pimux-dev"
version = "0.1.0"
description = "Development checks for the standalone terminal workspace"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
