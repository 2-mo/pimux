[project]
name = "pimux-dev"
version = "0.6.2"
description = "Terminal view runtime and development checks for PiMux"
requires-python = ">=3.10"
dependencies = [
    "blessed>=1.48,<2",
    "rich>=13,<16",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
