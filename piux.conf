# piux-managed: tmux >= 3.2; palette matches pi.terminal without importing it.
# Personal terminal settings; applies to all sessions on this tmux server.
set -g @piux_theme 'piux · purple / cyan'
set -g @piux_language en
set -g @piux_launcher "$HOME/.local/bin/piux"
set -g prefix C-a
set -g prefix2 None
unbind C-b
bind -N 'piux: 向应用发送 Ctrl-a（shell 中回到行首）' C-a send-prefix
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows off
# Continue in another session after closing the current one; exit if none remain.
set -g detach-on-destroy off
setw -g automatic-rename off
setw -g allow-rename off
set -g mouse on
# Keep VS Code's context menu; the tmux menu remains on Ctrl-a h.
unbind -q -n MouseDown3Pane
unbind -q -n MouseDown3Status
unbind -q -n MouseDown3StatusLeft
unbind -q -n MouseDown3Empty
unbind -q -n M-MouseDown3Pane
unbind -q -n M-MouseDown3Status
unbind -q -n M-MouseDown3StatusLeft
unbind -q -n M-MouseDown3Empty
set -g history-limit 100000
setw -g mode-keys vi
set -g status-keys emacs
set -g default-terminal tmux-256color
# A stable array slot makes repeated reloads idempotent. VS Code uses xterm-256color.
set -s terminal-features[100] 'xterm-256color:RGB:clipboard'
set -s set-clipboard external

# Keep the application's own background and ANSI palette.
set -g status 2
set -g status-interval 5
set -g status-style 'fg=#9ca3af,bg=#202329'
set -g status-left-length 24
set -g status-right-length 10000
set -g status-left '#[fg=#b7a1e8,bold] #{?@piux_view,#{@piux_view},#S} #[default] '
set -g status-right '#(#{q:@piux_launcher} __gpu-status)'
setw -g window-status-style 'fg=#9ca3af,bg=#202329'
setw -g window-status-current-style 'fg=#63c5f8,bg=#272b34'
setw -g window-status-format ' #I:#W#{?window_zoomed_flag, [ZOOM],} '
setw -g window-status-current-format ' › #I:#W#{?window_zoomed_flag, [ZOOM],} '
setw -g window-status-separator ' '
setw -g window-status-activity-style 'fg=#9ca3af,bg=#202329'
setw -g window-status-bell-style 'fg=#e5a35b,bg=#202329'
setw -g pane-border-style 'fg=#3b414d'
setw -g pane-active-border-style 'fg=#63c5f8'
setw -g mode-style 'fg=#63c5f8,bg=#272b34'
set -g message-style 'fg=#d8dce4,bg=#202329'
set -g message-command-style 'fg=#63c5f8,bg=#272b34'
set -g display-panes-colour '#9ca3af'
set -g display-panes-active-colour '#63c5f8'

set -g @piux_hint_normal '#[fg=#ffaf5f]Ctrl-a #[fg=#9ca3af]→ #[fg=#ffaf5f]d #[fg=#9ca3af]#{?#{==:#{@piux_language},en},detach,离开}  #[fg=#ffaf5f]h #[fg=#9ca3af]#{?#{==:#{@piux_language},en},menu,菜单}'

set -g @piux_hint_prefix '#[bg=#272b34,fg=#ffaf5f,bold]Ctrl-a#[bg=#202329,fg=#9ca3af,nobold] → #[fg=#ffaf5f]d #[fg=#9ca3af]#{?#{==:#{@piux_language},en},detach,离开}  #[fg=#ffaf5f]h #[fg=#9ca3af]#{?#{==:#{@piux_language},en},menu,菜单}'
set -g @piux_hint_copy '#[fg=#ffaf5f] [COPY] v #[fg=#9ca3af]#{?#{==:#{@piux_language},en},select,选择}  #[fg=#ffaf5f]y #[fg=#9ca3af]#{?#{==:#{@piux_language},en},copy,复制}  #[fg=#ffaf5f]/ #[fg=#9ca3af]#{?#{==:#{@piux_language},en},search,搜索}  #[fg=#ffaf5f]n/N #[fg=#9ca3af]#{?#{==:#{@piux_language},en},next/prev,下一/上一处}  #[fg=#ffaf5f]Esc #[fg=#9ca3af]#{?#{==:#{@piux_language},en},exit,退出}'
set -g @piux_hint_tree '#[fg=#b7a1e8] #{?#{==:#{@piux_language},en},[Manager],[管理·直接按键]} #[fg=#ffaf5f]↑↓ #[fg=#9ca3af]#{?#{==:#{@piux_language},en},select,选择}  #[fg=#ffaf5f]←→ #[fg=#9ca3af]#{?#{==:#{@piux_language},en},expand,收起/展开}  #[fg=#ffaf5f]Enter #[fg=#9ca3af]#{?#{==:#{@piux_language},en},open,进入}  #[fg=#ffaf5f]x #[fg=#9ca3af]#{?#{==:#{@piux_language},en},close (confirm),关闭(需确认)}  #[fg=#ffaf5f]q #[fg=#9ca3af]#{?#{==:#{@piux_language},en},back,返回}'
set -g @piux_hint_view '#[fg=#ffaf5f] ↑↓ / PgUp / PgDn #[fg=#9ca3af]#{?#{==:#{@piux_language},en},scroll,滚动}  #[fg=#ffaf5f]q / Esc #[fg=#9ca3af]#{?#{==:#{@piux_language},en},back,返回}'
# Reserve the rendered width of the actions in the selected language.
set -g @piux_hint_footer '#[align=left,fg=#9ca3af] #{=/-#{e|-|:#{client_width},#{?#{==:#{@piux_language},en},29,27}}/…:pane_current_path} #[align=right] #{?client_prefix,#{E:@piux_hint_prefix},#{E:@piux_hint_normal}} '
set -g status-format[1] '#{?#{==:#{pane_mode},copy-mode},#{E:@piux_hint_copy},#{?#{==:#{pane_mode},tree-mode},#{E:@piux_hint_tree},#{?pane_in_mode,#{E:@piux_hint_view},#{E:@piux_hint_footer}}}}'

# Notes are translated by the keyboard help page (Ctrl-a /).
bind -N 'piux: 新建 shell 窗口，继承当前目录' c new-window -n shell -c '#{pane_current_path}'
bind -N 'piux: 重命名当前窗口' , command-prompt -p '#{?#{==:#{@piux_language},en},Window name:,窗口名称：}' -I '#W' "rename-window -- '%%'"
bind -N 'piux: 查看完整目录路径；q / Esc 返回' P run-shell "printf '%s\\n' #{q:pane_current_path}"
bind -N 'piux: 展开当前会话的窗口列表' w run-shell -b "#{q:@piux_launcher} __client #{q:socket_path} #{q:client_name} windows"
bind -N 'piux: 管理会话和窗口；n 新建，x 关闭（需确认），q 返回' s run-shell -b "#{q:@piux_launcher} __client #{q:socket_path} #{q:client_name} manager"
bind -N 'piux: 左右分屏，继承当前目录' | split-window -h -c '#{pane_current_path}'
bind -N 'piux: 上下分屏，继承当前目录' - split-window -v -c '#{pane_current_path}'
bind -N 'piux: 切换到左侧分屏' Left select-pane -L
bind -N 'piux: 切换到右侧分屏' Right select-pane -R
bind -N 'piux: 切换到上方分屏' Up select-pane -U
bind -N 'piux: 切换到下方分屏' Down select-pane -D
bind -N 'piux: 上一个窗口' p previous-window
bind -N 'piux: 下一个窗口' n next-window
bind -N 'piux: 返回上次使用的窗口' l last-window
bind -N 'piux: 返回上次使用的会话，保持独立窗口选择' L run-shell -b "#{q:@piux_launcher} __client #{q:socket_path} #{q:client_name} previous"
bind -N 'piux: 放大当前分屏 / 恢复分屏' z resize-pane -Z
bind -N 'piux: 进入历史复制模式；v 选择，y 复制，/ 搜索' [ copy-mode
bind -N 'piux: 粘贴 tmux 缓冲区；本地剪贴板用 VS Code 粘贴键' ] paste-buffer
bind -N 'piux: 离开当前客户端，保留会话和任务' d detach-client
bind -N 'piux: 重载配置' r source-file '~/.tmux.conf' \; display-message '#{?#{==:#{@piux_language},en},piux configuration reloaded,piux 配置已重载}'
unbind -q '?'
bind -N 'piux: 查看此帮助；先按 Ctrl-a 并松开，再按操作键；数字键直接切窗口' / run-shell "#{q:@piux_launcher} __client #{q:socket_path} #{q:client_name} help"
unbind -q Space
bind -N 'piux: 打开操作菜单' h run-shell -b "#{q:@piux_launcher} __client #{q:socket_path} #{q:client_name} menu"

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
