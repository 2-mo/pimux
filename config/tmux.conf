# pimux-managed: tmux >= 3.2; palette matches pi.terminal without importing it.
# Personal terminal settings; applies to all sessions on this tmux server.
set -g @pimux_theme 'pimux · purple / cyan'
set -g @pimux_language en
set -g @pimux_launcher "$HOME/.local/bin/pimux"
set -g prefix C-a
set -g prefix2 None
unbind C-b
bind -N 'pimux: 向应用发送 Ctrl-a（shell 中回到行首）' C-a send-prefix
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows off
# Continue in another session after closing the current one; exit if none remain.
set -g detach-on-destroy off
setw -g automatic-rename off
setw -g allow-rename off
set -g mouse on
# Keep VS Code's context menu; the tmux menu remains on Ctrl-a h.
unbind -q -n MouseDown3Pane
unbind -q -n MouseDown3Status
unbind -q -n MouseDown3StatusLeft
unbind -q -n MouseDown3Empty
unbind -q -n M-MouseDown3Pane
unbind -q -n M-MouseDown3Status
unbind -q -n M-MouseDown3StatusLeft
unbind -q -n M-MouseDown3Empty
set -g history-limit 100000
setw -g mode-keys vi
set -g status-keys emacs
set -g default-terminal tmux-256color
set -g default-command 'exec bash --rcfile "$HOME/.config/pimux/shell.bash" -i'
# A stable array slot makes repeated reloads idempotent. VS Code uses xterm-256color.
set -s terminal-features[100] 'xterm-256color:RGB:clipboard'
set -s set-clipboard external

# Keep the application's own background and ANSI palette.
set -g status 2
set -g status-interval 5
set -g status-style 'fg=#9ca3af,bg=#202329'
set -g status-left-length 24
set -g status-right-length 10000
set -g status-left '#[fg=#b7a1e8,bold] #{?@pimux_view,#{@pimux_view},#S} #[default] '
set -g status-right '#{?#{==:#{@pimux_proxy_status},on},#[fg=#63c5f8]#[bold]⛓︎#[default] ,#{?#{==:#{@pimux_proxy_status},},#(#{q:@pimux_launcher} __proxy-status #{pane_pid}),}}#(#{q:@pimux_launcher} __gpu-status)'
setw -g window-status-style 'fg=#9ca3af,bg=#202329'
setw -g window-status-current-style 'fg=#63c5f8,bg=#272b34'
# Aggregate pane reports at render time, including windows shared across clients.
set -g @pimux_window_status ' #{?#{P:#{?@pimux_command_status,1,}},#[bold]#[reverse],}#I#[nobold]#[noreverse]:#W#{?window_zoomed_flag, [ZOOM],} '
set -g @pimux_window_status_current ' › #{?#{P:#{?@pimux_command_status,1,}},#[bold]#[reverse],}#I#[nobold]#[noreverse]:#W#{?window_zoomed_flag, [ZOOM],} '
setw -g window-status-format '#{E:@pimux_window_status}'
setw -g window-status-current-format '#{E:@pimux_window_status_current}'
setw -g window-status-separator ' '
setw -g window-status-activity-style 'fg=#9ca3af,bg=#202329'
setw -g window-status-bell-style 'fg=#e5a35b,bg=#202329'
setw -g pane-border-style 'fg=#3b414d'
setw -g pane-active-border-style 'fg=#63c5f8'
setw -g mode-style 'fg=#63c5f8,bg=#272b34'
set -g message-style 'fg=#d8dce4,bg=#202329'
set -g message-command-style 'fg=#63c5f8,bg=#272b34'
set -g display-panes-colour '#9ca3af'
set -g display-panes-active-colour '#63c5f8'

set -g @pimux_hint_windows '#[fg=#ffaf5f]c #[fg=#9ca3af]#{?#{==:#{@pimux_language},en},new window,新建窗口}  #[fg=#ffaf5f], #[fg=#9ca3af]#{?#{==:#{@pimux_language},en},rename,重命名}  #[fg=#ffaf5f]x #[fg=#9ca3af]#{?#{==:#{@pimux_language},en},close pane,关闭分屏}'
set -g @pimux_hint_normal '#[fg=#ffaf5f]Ctrl-a #[fg=#9ca3af]→ #{?#{e|>=|:#{client_width},100},#{E:@pimux_hint_windows}  ,}#[fg=#ffaf5f]h #[fg=#9ca3af]#{?#{==:#{@pimux_language},en},menu,菜单}  #[fg=#ffaf5f]d #[fg=#9ca3af]#{?#{==:#{@pimux_language},en},detach,离开}'

# Keep creation, renaming and closing visible before secondary actions.
set -g @pimux_hint_prefix_full '#[align=left,bg=#ffaf5f,fg=#202329,bold] Ctrl-a · #{?#{==:#{@pimux_language},en},next key,等待按键} #[default]  #{E:@pimux_hint_windows}  #[fg=#ffaf5f]v/- #[fg=#9ca3af]#{?#{==:#{@pimux_language},en},split,分屏}  #[fg=#ffaf5f]h #[fg=#9ca3af]#{?#{==:#{@pimux_language},en},menu,菜单}  #[fg=#ffaf5f]d #[fg=#9ca3af]#{?#{==:#{@pimux_language},en},detach,离开}  #[fg=#ffaf5f]Esc #[fg=#9ca3af]#{?#{==:#{@pimux_language},en},cancel,取消}'
set -g @pimux_hint_prefix_compact '#[align=left,bg=#ffaf5f,fg=#202329,bold] Ctrl-a #[default]  #{E:@pimux_hint_windows}  #[fg=#ffaf5f]h #[fg=#9ca3af]#{?#{==:#{@pimux_language},en},menu,菜单}  #[fg=#ffaf5f]Esc #[fg=#9ca3af]#{?#{==:#{@pimux_language},en},cancel,取消}'
set -g @pimux_hint_prefix_small '#[align=left,bg=#ffaf5f,fg=#202329,bold] Ctrl-a #[default]  #[fg=#ffaf5f]c #[fg=#9ca3af]#{?#{==:#{@pimux_language},en},new,新建}  #[fg=#ffaf5f], #[fg=#9ca3af]#{?#{==:#{@pimux_language},en},name,改名}  #[fg=#ffaf5f]x #[fg=#9ca3af]#{?#{==:#{@pimux_language},en},close,关闭}  #[fg=#ffaf5f]Esc'
set -g @pimux_hint_prefix '#{?#{e|>=|:#{client_width},#{w:#{E:@pimux_hint_prefix_full}}},#{E:@pimux_hint_prefix_full},#{?#{e|>=|:#{client_width},#{w:#{E:@pimux_hint_prefix_compact}}},#{E:@pimux_hint_prefix_compact},#{E:@pimux_hint_prefix_small}}}'
set -g @pimux_hint_copy '#[fg=#ffaf5f] [COPY] v #[fg=#9ca3af]#{?#{==:#{@pimux_language},en},select,选择}  #[fg=#ffaf5f]y #[fg=#9ca3af]#{?#{==:#{@pimux_language},en},copy,复制}  #[fg=#ffaf5f]/ #[fg=#9ca3af]#{?#{==:#{@pimux_language},en},search,搜索}  #[fg=#ffaf5f]n/N #[fg=#9ca3af]#{?#{==:#{@pimux_language},en},next/prev,下一/上一处}  #[fg=#ffaf5f]Esc #[fg=#9ca3af]#{?#{==:#{@pimux_language},en},exit,退出}'
set -g @pimux_hint_tree '#[fg=#b7a1e8] #{?#{==:#{@pimux_language},en},[Manager],[管理·直接按键]} #[fg=#ffaf5f]↑↓ #[fg=#9ca3af]#{?#{==:#{@pimux_language},en},select,选择}  #[fg=#ffaf5f]←→ #[fg=#9ca3af]#{?#{==:#{@pimux_language},en},expand,收起/展开}  #[fg=#ffaf5f]Enter #[fg=#9ca3af]#{?#{==:#{@pimux_language},en},open,进入}  #[fg=#ffaf5f]x #[fg=#9ca3af]#{?#{==:#{@pimux_language},en},close (confirm),关闭(需确认)}  #[fg=#ffaf5f]q #[fg=#9ca3af]#{?#{==:#{@pimux_language},en},back,返回}'
set -g @pimux_hint_view '#[fg=#ffaf5f] ↑↓ / PgUp / PgDn #[fg=#9ca3af]#{?#{==:#{@pimux_language},en},scroll,滚动}  #[fg=#ffaf5f]q / Esc #[fg=#9ca3af]#{?#{==:#{@pimux_language},en},back,返回}'
# Reserve the actual displayed width, including translated action labels.
set -g @pimux_hint_footer '#[align=left,fg=#9ca3af] #{=/-#{e|-|:#{client_width},#{e|+|:#{w:#{E:@pimux_hint_normal}},5}}/…:pane_current_path} #[align=right] #{E:@pimux_hint_normal} '
set -g status-format[1] '#{?client_prefix,#{E:@pimux_hint_prefix},#{?#{==:#{pane_mode},copy-mode},#{E:@pimux_hint_copy},#{?#{==:#{pane_mode},tree-mode},#{E:@pimux_hint_tree},#{?pane_in_mode,#{E:@pimux_hint_view},#{E:@pimux_hint_footer}}}}}'

# Notes are translated by the keyboard help page (Ctrl-a /).
bind -N 'pimux: 新建 shell 窗口，继承当前目录' c new-window -n shell -c '#{pane_current_path}'
bind -N 'pimux: 重命名当前窗口' , command-prompt -p '#{?#{==:#{@pimux_language},en},Window name:,窗口名称：}' -I '#W' "rename-window -- '%%'"
bind -N 'pimux: 查看完整目录路径；q / Esc 返回' P run-shell -b "#{q:@pimux_launcher} __client #{q:socket_path} #{q:client_name} path"
bind -N 'pimux: 复制当前目录路径' y run-shell -b "#{q:@pimux_launcher} __client #{q:socket_path} #{q:client_name} copy-path"
bind -N 'pimux: 展开当前会话的窗口列表' w run-shell -b "#{q:@pimux_launcher} __client #{q:socket_path} #{q:client_name} windows"
bind -N 'pimux: 管理会话和窗口；n 新建，x 关闭（需确认），q 返回' s run-shell -b "#{q:@pimux_launcher} __client #{q:socket_path} #{q:client_name} manager"
bind -N 'pimux: 左右分屏，继承当前目录' | split-window -h -c '#{pane_current_path}'
bind -N 'pimux: 左右分屏，继承当前目录' ｜ split-window -h -c '#{pane_current_path}'
bind -N 'pimux: 左右分屏，继承当前目录' v split-window -h -c '#{pane_current_path}'
bind -N 'pimux: 上下分屏，继承当前目录' - split-window -v -c '#{pane_current_path}'
bind -N 'pimux: 切换到左侧分屏' Left select-pane -L
bind -N 'pimux: 切换到右侧分屏' Right select-pane -R
bind -N 'pimux: 切换到上方分屏' Up select-pane -U
bind -N 'pimux: 切换到下方分屏' Down select-pane -D
bind -N 'pimux: 上一个窗口' p previous-window
bind -N 'pimux: 下一个窗口' n next-window
bind -N 'pimux: 返回上次使用的窗口' l last-window
bind -N 'pimux: 返回上次使用的会话，保持独立窗口选择' L run-shell -b "#{q:@pimux_launcher} __client #{q:socket_path} #{q:client_name} previous"
bind -N 'pimux: 放大当前分屏 / 恢复分屏' z resize-pane -Z
bind -N 'pimux: 进入历史复制模式；v 选择，y 复制，/ 搜索' [ copy-mode
bind -N 'pimux: 粘贴 tmux 缓冲区；本地剪贴板用 VS Code 粘贴键' ] paste-buffer
bind -N 'pimux: 离开当前客户端，保留会话和任务' d detach-client
bind -N 'pimux: 重载配置' r run-shell -b "#{q:@pimux_launcher} __client #{q:socket_path} #{q:client_name} reload"
bind -N 'pimux: 查看显卡详情；q / Esc 返回' g run-shell -b "#{q:@pimux_launcher} __client #{q:socket_path} #{q:client_name} gpu"
unbind -q '?'
bind -N 'pimux: 查看此帮助；先按 Ctrl-a 并松开，再按操作键；数字键直接切窗口' / run-shell -b "#{q:@pimux_launcher} __client #{q:socket_path} #{q:client_name} help"
bind -N 'pimux: 关闭当前分屏；结束其中的程序，需确认' x run-shell -b "#{q:@pimux_launcher} __client #{q:socket_path} #{q:client_name} close-pane"
unbind -q Space
bind -N 'pimux: 打开操作菜单' h run-shell -b "#{q:@pimux_launcher} __client #{q:socket_path} #{q:client_name} menu"

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
